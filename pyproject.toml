[project]
name = "smartlawai"
version = "0.1.0"
description = "SmartLawAI: hallucination-aware RAG legal intelligence (portable: local / Kaggle / GCloud)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=0.10",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17",
  "pypdf>=4.0",
  "langdetect>=1.0.9",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# heavy ML deps kept separate so the local smoke test installs fast
ml = [
  # torch>=2.5: current transformers releases require it and silently disable their
  # own PyTorch integration otherwise (NameError deep in an unrelated import, not a
  # clear version error) -- see docker/Dockerfile.train's base-image comment.
  "torch>=2.5",
  # Upper-bounded, not just floored: an unbounded transformers>=4.40 pulled 5.16.1 at
  # build time, which (paired with an equally-unbounded trl) broke SFTTrainer's
  # constructor signature. <4.50 keeps it in the generation train_qlora.py and
  # finetune_inlegalbert.py were actually written against and tested with.
  "transformers>=4.40,<4.50",
  "sentence-transformers>=3.0,<4.0",
  "spacy>=3.7,<3.9",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]
gcloud = [
  "google-cloud-storage>=2.16",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
]
# M1 data-foundation pipeline. Kept separate from [train]: that group's pins
# (peft/trl/bitsandbytes/accelerate) are tightly coupled to the GPU/QLoRA stack
# and already documented there as fragile; this is lightweight and CPU-only.
data = [
  "datasets>=2.19,<3.0",   # same pin as [train] -- avoid two divergent pins of one package
  "huggingface_hub>=0.23",
  "datasketch>=1.6",
  "jiwer>=3.0",
  "google-cloud-aiplatform>=1.70",  # Vertex AI Model Garden calls for M1's Path 2 pilot/run
  "kagglehub>=0.3",  # targeted per-year folder download for the OCR-WER gold-set source PDFs
]
train = [
  "peft>=0.11,<0.14",
  # trl<0.12: SFTTrainer(dataset_text_field=..., max_seq_length=..., tokenizer=...)
  # is that generation's API -- 1.10.0 (an unbounded floor grabbed it) moved those
  # into a separate SFTConfig object instead, breaking train_qlora.py's constructor
  # call outright ("unexpected keyword argument 'dataset_text_field'").
  "trl>=0.9,<0.12",
  "bitsandbytes>=0.43,<0.45",
  "accelerate>=0.30,<0.35",
  "datasets>=2.19,<3.0",
]
# CLI and UI are dev-facing skeleton entrypoints (M0) -- core/adapters/registry
# code never imports these, so they stay out of core `dependencies`, matching
# the single-purpose shape of every extras group above.
cli = ["click>=8.1"]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.4", "click>=8.1"]

[project.scripts]
smartlaw = "smartlawai.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
