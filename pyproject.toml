[project]
name = "smartlawai"
version = "0.1.0"
description = "SmartLawAI: hallucination-aware RAG legal intelligence (portable: local / Kaggle / GCloud)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=0.10",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17",
  "pypdf>=4.0",
  "langdetect>=1.0.9",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# heavy ML deps kept separate so the local smoke test installs fast
ml = [
  # torch>=2.5: current transformers releases require it and silently disable their
  # own PyTorch integration otherwise (NameError deep in an unrelated import, not a
  # clear version error) -- see docker/Dockerfile.train's base-image comment.
  "torch>=2.5",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "spacy>=3.7",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]
gcloud = [
  "google-cloud-storage>=2.16",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
]
train = [
  "peft>=0.11",
  "trl>=0.9",
  "bitsandbytes>=0.43",
  "accelerate>=0.30",
  "datasets>=2.19",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
