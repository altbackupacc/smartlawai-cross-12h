workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-4
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-3.py310:latest
      command:
        - bash
        - -c
        - "pip install -q google-cloud-storage && python -c \"from google.cloud import storage; storage.Client().bucket('smartlawai-1-m1-pilot').blob('hhem_score_batched.py').download_to_filename('/tmp/hhem_score_batched.py')\" && python /tmp/hhem_score_batched.py l4_4"
