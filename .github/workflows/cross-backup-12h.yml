name: Cross-Account Mirror (12h)

on:
  schedule:
    - cron: '0 */12 * * *'   # Runs every 12 hours
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push mirror to destination account
        env:
          MY_SECRET_TOKEN: ${{ secrets.CROSS_ACOUNT_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$MY_SECRET_TOKEN" | tr -d '\n\r ')"
          git push --mirror "https://${TOKEN}@github.com/altbackupacc/smartlawai-cross-12h.git"
