name: Mirror to backup repo (delayed)

# Deliberately lagged, not instant: mirrors kramjiy/smartlawai -> kramjiy/smartlawai-backup-1
# every 6 hours. The point of the delay is to survive a bad `git push --force` or an
# accidental branch/history rewrite on the primary repo -- an instant mirror (or OneDrive,
# which already syncs this folder continuously) would propagate that damage just as
# instantly. This gives up to a 6-hour window to notice and pause the workflow before
# the backup converges to match the bad state too.
#
# One-time setup before this can run:
#   1. Create an empty private repo: kramjiy/smartlawai-backup-1 (no README/gitignore).
#   2. Create a fine-grained PAT scoped ONLY to smartlawai-backup-1, Contents + Workflows: Read and write.
#   3. Add it as a repository secret ON THIS REPO (kramjiy/smartlawai, NOT smartlawai-backup-1
#      -- the workflow runs here, so this is the only place it can read the secret from),
#      named BACKUP_REPO_TOKEN_1 (Settings -> Secrets and variables -> Actions -> New repository secret).
#
# Uses actions/checkout to read this repo instead of a manually-constructed
# `git clone` with GITHUB_TOKEN spliced into the URL -- that approach consistently
# failed with "Repository not found" despite correct Actions/Workflow permissions
# settings, for reasons never conclusively identified. actions/checkout is GitHub's
# own maintained mechanism for exactly this and handles auth internally, removing
# the failure point rather than continuing to guess at its cause.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger an out-of-band sync manually from the Actions tab

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to backup repo
        env:
          BACKUP_REPO_TOKEN_1: ${{ secrets.BACKUP_REPO_TOKEN_1 }}
        run: |
          # Strip any stray whitespace/newline a manual copy-paste into the secret
          # may have introduced -- a trailing \n here breaks the URL below outright.
          TOKEN="$(printf '%s' "$BACKUP_REPO_TOKEN_1" | tr -d '\n\r ')"
          git push --mirror "https://x-access-token:${TOKEN}@github.com/kramjiy/smartlawai-backup-1.git"
